[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "errataguard"
version = "0.1.0"
description = "AArch64 Cortex-A53 Errata Static Verification Prototype"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ErrataGuard Systems"}
]
keywords = ["aarch64", "cortex-a53", "errata", "static-analysis", "elf", "verification"]
dependencies = [
    "pyelftools>=0.30",
    "capstone>=5.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
errataguard = "errataguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
