erratum: A53-DEMO-001
title: "Demo rule: ADRP followed by dependent LDR (not an Arm erratum)"
architecture: AArch64
cpu: Cortex-A53
authoritative: false
affected_revisions:
  - r0p0
  - r0p1
  - r0p2
  - r0p3
  - r0p4
candidate:
  mnemonics:
    - adrp
conditions:
  - type: instruction_sequence
    description: "ADRP instruction immediately followed by LDR"
    pattern:
      - ldr
  - type: register_dependency
    description: "LDR depends on ADRP destination register"
    dependency: destination_to_source
    offset: 1
workaround:
  description: >
    Insert a NOP or an intervening independent instruction between ADRP and the dependent load, or apply toolchain mitigation flag -mfix-cortex-a53-843419.
  suggestion: "Insert NOP between ADRP and LDR"
references:
  - "Arm Cortex-A53 MPCore Software Developers Errata Notice, Document ID: ARM-EPM-048406, Erratum 843419, Section 7.2"
severity: warning
